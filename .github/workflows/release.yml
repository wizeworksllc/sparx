name: Release

# Every push to main ships: verify (ci.yml) → build the three images → prove the
# cluster can pull them → roll out to the `sparx` namespace → tag. Data is not a
# stage here: these apps own no database (their rows are the platform's, and
# api-rest's release applies the schema), so a release is images and manifests
# only.
#
# ── WHERE THIS RUNS ────────────────────────────────────────────────────────
#
# A co-tenant on `aks-sparx-prod-cus`, like Piggles, wize.works and kanNINJA.
# The cloud under it (the cluster, the `kv-sparx-prod-cus` vault, this
# pipeline's Entra identity) and the Caddy routes for sparx.works,
# market.sparx.works and app.sparx.works are wize-infrastructure's. Repository
# variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and
# AZURE_KEY_VAULT_NAME name them; the identity must trust THIS repository's
# OIDC subject (wize-infrastructure terraform/bootstrap-azure/org-move.tf).
#
# Images go to GHCR as ghcr.io/wizeworksllc/sparx-{web,market,workbench}. The
# cluster pulls WITHOUT credentials, like every other tenant, so each package
# must be public; `verify-pullable` says so by name before a rollout can hang
# on ImagePullBackOff.
#
# Until an app's manifest is listed in k8s/kustomization.yaml, the deploy job
# applies only the namespace, the ConfigMap and the Secret, and its rollout,
# restart and smoke steps find no Deployment and do nothing. That is the state
# this repository starts in (see "THE MOVE OUT OF sparx-prod" there).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = read the conventional commits)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'patch', 'minor', 'major', 'none']

permissions:
  contents: read

# One release at a time, and never cancelled halfway: a rollout stopped between
# the Secret and the Deployments leaves pods reading a half-updated set.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: sparx

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
    secrets:
      FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  build:
    name: Build ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # actions_key is the Key Vault name: the platform's release read the
          # same vault values for these apps (NEXT_ACTIONS_KEY_WEB → next-actions-key-web),
          # so a page left open across the move still posts to an action the new
          # build knows.
          - { image: sparx-web, dockerfile: apps/web/Dockerfile, actions_key: next-actions-key-web }
          - { image: sparx-market, dockerfile: apps/market/Dockerfile, actions_key: next-actions-key-market }
          - {
              image: sparx-workbench,
              dockerfile: apps/workbench/Dockerfile,
              actions_key: next-actions-key-workbench,
            }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skipped until the repository variables exist, so the images still build
      # and push (and their GHCR packages exist to be made public) before the
      # Azure side is wired. The deploy job refuses to run without them.
      - uses: azure/login@v2
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The key Next derives server-action ids from (SI-2). The same vault value
      # reaches the running pod as NEXT_SERVER_ACTIONS_ENCRYPTION_KEY, so a page
      # left open across a deploy still posts to an action the new build knows.
      # Optional: without it Next picks its own key, and the pod gets none either.
      - name: Server-action key from Key Vault
        env:
          VAULT: ${{ vars.AZURE_KEY_VAULT_NAME }}
          NAME: ${{ matrix.actions_key }}
        run: |
          set -euo pipefail
          if [ -n "$VAULT" ] && key=$(az keyvault secret show --vault-name "$VAULT" --name "$NAME" --query value -o tsv 2>/dev/null) && [ -n "$key" ]; then
            echo "::add-mask::$key"
            printf '%s' "$key" > "$RUNNER_TEMP/next_actions_key"
          else
            echo "::notice::No $NAME in Key Vault ${VAULT:-(AZURE_KEY_VAULT_NAME unset)}: Next picks its own server-action key."
            : > "$RUNNER_TEMP/next_actions_key"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repository root: every Dockerfile copies from it.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          # The PostHog PROJECT key ships inside the browser bundle and can only
          # send events in, so it is a build-arg, not a secret. NEXT_PUBLIC_* is
          # inlined at compile time, which is why it cannot arrive at deploy.
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_PROJECT_KEY }}
            APP_VERSION=${{ github.sha }}
            WIZELENS_RELEASE=${{ github.sha }}
          # BuildKit secrets, never build-args: an arg stays readable in the
          # image's layer history. GITHUB_TOKEN reads the @wizeworksllc/*
          # packages for the install and expires with this job.
          secrets: |
            github_packages_token=${{ secrets.GITHUB_TOKEN }}
            fontawesome_npm_token=${{ secrets.FONTAWESOME_NPM_TOKEN }}
          secret-files: |
            next_actions_key=${{ runner.temp }}/next_actions_key
          tags: |
            ghcr.io/wizeworksllc/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/wizeworksllc/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }},ignore-error=true

  # ------------------------------------------------------------------
  # Prove the kubelet will be able to pull, BEFORE asking it to.
  #
  # Nothing in k8s/ carries an imagePullSecret: the cluster pulls anonymously.
  # A new package can start private, and a private package fails as
  # ImagePullBackOff, found as a rollout that never becomes ready. GHCR answers
  # an unauthorised anonymous manifest fetch with 404, not 401, so a 404 is told
  # apart below rather than guessed at.
  # ------------------------------------------------------------------
  verify-pullable:
    name: Verify the images pull anonymously
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous pull check
        env:
          TAG: ${{ github.sha }}
        run: |
          set -uo pipefail
          # All four media types: this build is single-platform with provenance
          # off, so its manifest is a plain image manifest, not an index, and a
          # registry serves a manifest only when its type is in Accept.
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          bad=0
          for PKG in sparx-web sparx-market sparx-workbench; do
            TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:wizeworksllc/${PKG}:pull&service=ghcr.io" | jq -r .token)
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
              "https://ghcr.io/v2/wizeworksllc/${PKG}/manifests/${TAG}")
            if [ "$CODE" = "200" ]; then
              echo "OK: ghcr.io/wizeworksllc/${PKG}:${TAG} pulls anonymously."
              continue
            fi
            bad=1
            if curl -s -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/wizeworksllc/${PKG}/tags/list" | grep -q '"tags"'; then
              echo "::error::${PKG} is public but ${TAG} did not come back (HTTP ${CODE}): a missing tag or a media type outside Accept."
            else
              echo "::error::${PKG} is PRIVATE, so the cluster cannot pull it. Make it public once: github.com/orgs/wizeworksllc/packages/container/${PKG}/settings -> Change visibility -> Public. Then re-run this workflow."
            fi
          done
          exit "$bad"

  deploy:
    name: Roll out to AKS
    needs: verify-pullable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Repository variables are set
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          VAULT: ${{ vars.AZURE_KEY_VAULT_NAME }}
        run: |
          missing=""
          [ -n "$CLIENT" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$TENANT" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$SUBSCRIPTION" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "$VAULT" ] || missing="$missing AZURE_KEY_VAULT_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Repository variable(s) not set:$missing. Set them on this repository (Settings -> Secrets and variables -> Actions -> Variables) from wize-infrastructure's bootstrap-azure outputs, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Cluster credentials and the namespace
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$CLUSTER" --overwrite-existing
          # Before the Secret below, which needs somewhere to live. The same
          # object is in k8s/kustomization.yaml, so the apply later owns it.
          kubectl apply -f k8s/namespace.yaml

      # Key Vault -> the `sparx-app-secrets` Secret, before the apply, so a new
      # pod starts with its keys in place. The vault names are the ones the
      # platform's release already writes for these apps in sparx-prod. Every
      # one is optional: an app runs without its WizeLens key, and without a
      # server-action key Next picks its own. Values go into `data` as base64
      # built with jq from files, never through $(…), which would strip a
      # trailing newline from key material.
      - name: Secrets from Key Vault
        env:
          VAULT: ${{ vars.AZURE_KEY_VAULT_NAME }}
          SECRETS: |
            NEXT_ACTIONS_KEY_WEB=next-actions-key-web
            NEXT_ACTIONS_KEY_MARKET=next-actions-key-market
            NEXT_ACTIONS_KEY_WORKBENCH=next-actions-key-workbench
            WIZELENS_KEY_WEB=wizelens-key-web
            WIZELENS_KEY_MARKET=wizelens-key-market
            WIZELENS_KEY_WORKBENCH=wizelens-key-workbench
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/secrets"; mkdir -p "$work"
          echo '{}' > "$work/data.json"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            env_name="${line%%=*}"; name="${line#*=}"
            if [ -z "$VAULT" ] || ! az keyvault secret show --vault-name "$VAULT" --name "$name" -o json > "$work/one.json" 2>/dev/null; then
              echo "::notice::$name is not in Key Vault ${VAULT:-(AZURE_KEY_VAULT_NAME unset)}: $env_name stays unset."
              continue
            fi
            jq -j '.value' "$work/one.json" | base64 -w0 > "$work/one.b64"
            jq --arg k "$env_name" --rawfile v "$work/one.b64" '. + {($k): $v}' "$work/data.json" > "$work/next.json"
            mv "$work/next.json" "$work/data.json"
          done <<< "$SECRETS"
          jq --arg ns "$NAMESPACE" \
            '{apiVersion: "v1", kind: "Secret", type: "Opaque",
              metadata: {name: "sparx-app-secrets", namespace: $ns}, data: .}' \
            "$work/data.json" | kubectl apply -f -
          echo "sparx-app-secrets: $(jq 'length' "$work/data.json") key(s)."
          rm -rf "$work"

      # Pinned to the commit's tag, never `:latest`: a rollout to a mutable tag
      # cannot be reproduced or rolled back by revision.
      #
      # --prune, scoped to the label k8s/kustomization.yaml stamps: an app taken
      # out of the kustomization is deleted here on the next release. The Secret
      # above carries no such label, so it is never pruned.
      - name: Pin images and apply
        run: |
          set -euo pipefail
          cd k8s
          for app in sparx-web sparx-market sparx-workbench; do
            kustomize edit set image "ghcr.io/wizeworksllc/${app}=ghcr.io/wizeworksllc/${app}:${GITHUB_SHA}"
          done
          cd ..
          kubectl apply -k k8s/ --prune -l app.kubernetes.io/part-of=sparx

      # A pod reads its Secret only when it starts, and an unchanged image
      # leaves the pods alone, so a changed key would go unread. A hash of the
      # Secret on each pod template changes exactly when the Secret does.
      - name: Restart pods when the Secret changes
        run: |
          set -euo pipefail
          # The single quotes are a Go template for kubectl, not shell.
          # shellcheck disable=SC2016
          hash=$(kubectl get secret sparx-app-secrets -n "$NAMESPACE" \
            -o go-template='{{range $k, $v := .data}}{{$k}}={{$v}};{{end}}' | sha256sum | cut -c1-16)
          patch="{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"sparx/secrets-hash\":\"$hash\"}}}}}"
          for d in $(kubectl get deploy -n "$NAMESPACE" -l app.kubernetes.io/part-of=sparx -o name); do
            kubectl patch "$d" -n "$NAMESPACE" --type merge -p "$patch"
          done

      - name: Wait for every rollout
        run: |
          set -euo pipefail
          for d in $(kubectl get deploy -n "$NAMESPACE" -l app.kubernetes.io/part-of=sparx -o name); do
            if ! kubectl rollout status -n "$NAMESPACE" "$d" --timeout=300s; then
              echo "::error::$d did not become ready. Recent state:"
              kubectl get pods -n "$NAMESPACE" -o wide
              kubectl describe -n "$NAMESPACE" "$d" | tail -40
              kubectl logs -n "$NAMESPACE" "$d" --tail=100 --all-containers || true
              exit 1
            fi
          done

      # From inside the cluster, through each Service, at the path its own
      # readiness probe uses. The public hostnames depend on Caddy routes in
      # wize-infrastructure, so a green rollout here does not prove those.
      #
      # RETRIES, because a NEW Service's name may not resolve yet. Caddy asks for
      # every `sparx-<app>.sparx` name on each request, long before the app is
      # listed here, so CoreDNS holds a cached NXDOMAIN for up to 30 seconds after
      # the Service appears. The first release of sparx-web failed on exactly
      # that ("Could not resolve host") while the pod was serving. curl's
      # --retry-all-errors retries a failed lookup too; 12 x 5s outlasts the cache.
      - name: Smoke test each Service
        run: |
          set -euo pipefail
          for d in $(kubectl get deploy -n "$NAMESPACE" -l app.kubernetes.io/part-of=sparx -o jsonpath='{.items[*].metadata.name}'); do
            path=$(kubectl get deploy "$d" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.path}')
            echo "→ http://$d.$NAMESPACE.svc.cluster.local:3000$path"
            kubectl run "smoke-$d-$RANDOM" --namespace "$NAMESPACE" --image=curlimages/curl:8.10.1 \
              --restart=Never --rm -i --quiet --command -- \
              curl -fsS --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors \
              "http://$d.$NAMESPACE.svc.cluster.local:3000$path"
            echo
          done

  # ------------------------------------------------------------------
  # The version tag, cut LAST, so a `v*` tag means the version actually
  # shipped rather than merely that someone pushed a `feat:`. Gated on every
  # stage SUCCEEDING, not merely not failing: a failed build skips everything
  # after it, and three skips would otherwise read as a clean release.
  #
  # Bump rules (mathieudutour/github-tag-action defaults):
  #   feat:                           → minor
  #   fix: / perf:                    → patch
  #   feat!: / BREAKING CHANGE footer → major
  #   chore/docs/refactor/ci/build/test/style → no bump
  # `default_bump: false` means a push with no releasable commits cuts no tag
  # at all. `bump: none` on a dispatch re-runs a release without minting one.
  # ------------------------------------------------------------------
  tag:
    name: Tag the release
    needs: [build, verify-pullable, deploy]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.verify-pullable.result == 'success' &&
      needs.deploy.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.bump != 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag. Deliberately not granted workflow-wide.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # conventional-commit analysis needs the whole history

      - name: Tag the release
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ (github.event_name == 'workflow_dispatch' && inputs.bump != 'auto') && inputs.bump || false }}
          tag_prefix: v
          release_branches: main
          fetch_all_tags: true

      - name: Report
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          if [ -n "$NEW_TAG" ]; then
            {
              echo '### Released'
              echo ''
              echo "\`$NEW_TAG\` was cut after the release succeeded, so it marks a version that actually shipped."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::notice::No releasable commits since the last tag, so no tag was cut.'
          fi

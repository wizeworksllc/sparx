packages:
  - 'apps/*'
  - 'packages/*'

# One version for every silicaui package, the same pins the platform uses.
# Apps reference these as "catalog:", so a bump happens here once.
catalog:
  '@wizeworks/silicaui': ^0.60.3
  '@wizeworks/silicaui-react': ^0.60.3
  '@wizeworks/silicaui-html': ^0.60.3
  '@wizeworks/silicaui-editor': ^0.60.3
  '@wizeworks/silicaui-charts': ^0.60.3
  '@wizeworks/silicaui-builder': ^0.60.3
